<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Efectos con Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-lime-200 p-4">

  <!-- Encabezado: tres cajas con borde azul -->
  <header>
    <div class="border-4 border-blue-500 p-4 mb-2">Caja 1</div>
    <div class="border-4 border-blue-500 p-4 mb-2">Caja 2</div>
    <div class="border-4 border-blue-500 p-4 mb-2">Caja 3</div>
  </header>

  <!-- Sección con borde rojo y tres columnas -->
  <main class="grid grid-cols-3 gap-4 border-4 border-red-500 p-6 mb-2 text-center">

    <div>
      <p>blur</p>
      <div class="w-32 h-32 mx-auto rounded-full bg-red-400 blur-sm"></div>
      <p>intensidad</p>
      <div class="w-32 h-32 mx-auto bg-blue-500 blur-md"></div>
    </div>

    <div>
      <p>transparente</p>
      <div class="w-32 h-32 mx-auto rounded-full bg-red-400 opacity-50"></div>
      <p>opacidad</p>
      <div class="w-32 h-32 mx-auto bg-blue-500 opacity-25"></div>
    </div>

    <div>
      <p>escala de grises</p>
      <div class="w-32 h-32 mx-auto rounded-full bg-red-400 grayscale"></div>
      <p>libre</p>
      <div class="w-32 h-32 mx-auto bg-blue-500 sepia"></div>
    </div>

  </main>

  <!-- Pie de página -->
  <footer class="border-4 border-slate-600 p-3 text-center">
    diseñado por: Pablo Kevin Inti Quilla Apaza
  </footer>

</body>
</html>
